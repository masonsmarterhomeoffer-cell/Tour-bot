<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Tour & Interactive Floor Plan Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .vision-cone { clip-path: polygon(50% 50%, 15% 0%, 85% 0%); }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="h-full w-full overflow-hidden flex flex-col font-sans select-none bg-slate-950">

  <!-- Header -->
  <header class="h-16 border-b border-slate-800 bg-slate-900/90 backdrop-blur px-6 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/20">
        <i data-lucide="compass" class="w-5 h-5"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <input id="prop-title" type="text" oninput="saveMeta()" class="font-bold text-sm bg-transparent border-b border-transparent hover:border-slate-700 focus:border-blue-500 focus:outline-none text-white px-1 py-0.5 transition w-72">
          <input id="prop-price" type="text" oninput="saveMeta()" class="text-xs font-mono px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold w-28 bg-transparent focus:outline-none focus:border-emerald-400">
        </div>
        <input id="prop-meta" type="text" oninput="saveMeta()" class="text-xs text-slate-400 px-1 mt-0.5 bg-transparent border-b border-transparent hover:border-slate-700 focus:border-blue-500 focus:outline-none w-96">
      </div>
    </div>

    <div class="flex items-center gap-2.5">
      <button onclick="clearAllData()" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-rose-400 hover:text-rose-300 bg-rose-950/30 border border-rose-800/40 hover:bg-rose-950/60 transition flex items-center gap-1.5">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        <span>Clear Project</span>
      </button>

      <button id="btn-mode" onclick="toggleMode()" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold border transition flex items-center gap-2 bg-blue-600 border-blue-400 text-white shadow-lg shadow-blue-600/20">
        <i data-lucide="eye" class="w-3.5 h-3.5"></i>
        <span id="mode-text">Client Preview</span>
      </button>
    </div>
  </header>

  <!-- Workspace -->
  <div class="flex-1 flex overflow-hidden">

    <!-- Floor Plan Panel -->
    <div id="plan-panel" class="w-[440px] border-r border-slate-800 bg-slate-900/40 flex flex-col shrink-0 transition-all duration-300">
      <div class="p-3.5 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="layers" class="w-4 h-4 text-blue-400"></i>
          <span class="text-xs font-bold uppercase tracking-wider text-slate-300">Floor Plan</span>
        </div>

        <div id="studio-plan-actions" class="flex items-center gap-2">
          <label class="text-[11px] font-semibold text-slate-300 hover:text-white bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-lg cursor-pointer transition flex items-center gap-1">
            <i data-lucide="upload" class="w-3 h-3 text-blue-400"></i> Blueprint
            <input type="file" accept="image/*" onchange="uploadBlueprint(event)" class="hidden">
          </label>
          <button id="btn-drop-pin" onclick="toggleAddPin()" class="text-[11px] font-semibold px-2.5 py-1 rounded-lg border transition flex items-center gap-1 bg-blue-600/20 border-blue-500/40 text-blue-400 hover:bg-blue-600/30">
            <i data-lucide="map-pin" class="w-3 h-3"></i>
            <span id="pin-btn-text">Place Pin</span>
          </button>
        </div>
      </div>

      <!-- Floor Plan Canvas -->
      <div class="flex-1 p-5 flex items-center justify-center overflow-hidden bg-slate-950/80 relative">
        <div id="floorplan-canvas" onclick="handlePlanClick(event)" class="w-full aspect-[4/3] rounded-2xl relative border border-slate-800 bg-slate-900/60 p-3 overflow-hidden shadow-inner cursor-default bg-center bg-contain bg-no-repeat">
          <svg id="vector-schematic" class="w-full h-full opacity-35 pointer-events-none" viewBox="0 0 400 300">
            <rect x="20" y="20" width="360" height="260" fill="none" stroke="#3b82f6" strokeWidth="2.5" />
            <line x1="20" y1="170" x2="200" y2="170" stroke="#60a5fa" strokeWidth="2" strokeDasharray="4 4" />
            <line x1="200" y1="20" x2="200" y2="280" stroke="#3b82f6" strokeWidth="2" />
            <line x1="200" y1="120" x2="380" y2="120" stroke="#3b82f6" strokeWidth="2" />
            <text x="110" y="100" fill="#94a3b8" fontSize="11" textAnchor="middle" fontWeight="bold">ZONE A</text>
            <text x="110" y="230" fill="#94a3b8" fontSize="11" textAnchor="middle" fontWeight="bold">ZONE B</text>
            <text x="290" y="70" fill="#94a3b8" fontSize="11" textAnchor="middle" fontWeight="bold">ZONE C</text>
            <text x="290" y="200" fill="#94a3b8" fontSize="11" textAnchor="middle" fontWeight="bold">ZONE D</text>
          </svg>
          <div id="pins-container" class="absolute inset-0 pointer-events-none"></div>
        </div>
      </div>

      <!-- Pin Tuning (Studio Mode Only) -->
      <div id="pin-tuning-bar" class="p-3.5 border-t border-slate-800 bg-slate-900/70 hidden space-y-2">
        <div class="flex items-center justify-between text-xs">
          <span class="font-semibold text-slate-300 flex items-center gap-1.5">
            <i data-lucide="sliders" class="w-3.5 h-3.5 text-blue-400"></i>
            Camera Angle (<span id="angle-display">0</span>°)
          </span>
          <button onclick="deleteCurrentPin()" class="text-rose-400 hover:text-rose-300 text-[11px] flex items-center gap-1">
            <i data-lucide="trash-2" class="w-3 h-3"></i> Remove Pin
          </button>
        </div>
        <input id="angle-slider" type="range" min="0" max="360" value="0" oninput="updatePinAngle(this.value)" class="w-full accent-blue-500 bg-slate-800">
      </div>

      <!-- Room Directory & Photos -->
      <div class="p-4 border-t border-slate-800 bg-slate-950/60">
        <div class="flex justify-between items-center mb-2.5">
          <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Rooms (<span id="room-count">0</span>)</span>
          <label id="upload-photos-btn" class="text-[11px] text-blue-400 hover:text-blue-300 cursor-pointer flex items-center gap-1 font-semibold">
            <i data-lucide="plus" class="w-3 h-3"></i> Upload Photos
            <input id="photo-input" type="file" multiple accept="image/*" onchange="uploadPhotos(event)" class="hidden">
          </label>
        </div>
        <div id="room-tray" class="flex gap-2 overflow-x-auto pb-1 custom-scroll"></div>
      </div>
    </div>

    <!-- Main Room Image Display -->
    <div class="flex-1 relative bg-black flex items-center justify-center overflow-hidden">
      <div id="photo-canvas" onclick="handlePhotoClick(event)" class="w-full h-full relative flex items-center justify-center">
        <img id="main-photo" src="" alt="Property Room" class="w-full h-full object-cover transition-opacity duration-300 hidden">
        <div id="no-photo-placeholder" class="text-center p-8">
          <div class="w-16 h-16 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center mx-auto mb-3 text-slate-500">
            <i data-lucide="image" class="w-8 h-8"></i>
          </div>
          <h3 class="text-sm font-semibold text-slate-300">No Photos in Project</h3>
          <p class="text-xs text-slate-500 mt-1 max-w-xs">Click "Upload Photos" on the left panel to load your pictures.</p>
        </div>

        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-transparent to-black/30 pointer-events-none"></div>
        <div id="tags-layer" class="absolute inset-0 pointer-events-none"></div>
      </div>

      <!-- Active Room Spec Card -->
      <div id="room-info-card" class="absolute bottom-6 left-6 z-20 max-w-lg bg-slate-900/85 backdrop-blur-md border border-slate-800 p-5 rounded-2xl shadow-2xl pointer-events-auto hidden">
        <div class="flex justify-between items-start mb-1 gap-4">
          <input id="inp-room-name" type="text" oninput="saveCurrentRoomMeta()" class="text-lg font-bold text-white tracking-wide bg-transparent border-b border-transparent hover:border-slate-700 focus:border-blue-500 focus:outline-none w-full">
          <input id="inp-room-dims" type="text" oninput="saveCurrentRoomMeta()" class="text-[11px] font-mono px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20 font-semibold w-28 bg-transparent text-right focus:outline-none">
        </div>
        <input id="inp-room-ceiling" type="text" oninput="saveCurrentRoomMeta()" class="text-[11px] text-slate-400 font-medium mb-2.5 bg-transparent border-b border-transparent hover:border-slate-700 focus:border-blue-500 focus:outline-none w-48">
        <textarea id="inp-room-desc" rows="2" oninput="saveCurrentRoomMeta()" class="text-xs text-slate-300 leading-relaxed bg-transparent border border-transparent hover:border-slate-800 focus:border-blue-500 focus:outline-none w-full rounded p-1 resize-none"></textarea>
        
        <div id="studio-room-delete" class="mt-2 pt-2 border-t border-slate-800/80 flex justify-end">
          <button onclick="deleteCurrentRoom()" class="text-[11px] text-rose-400 hover:text-rose-300 flex items-center gap-1">
            <i data-lucide="trash-2" class="w-3 h-3"></i> Delete This Room
          </button>
        </div>
      </div>

      <!-- Tag Detail Drawer -->
      <div id="tag-popout" class="absolute top-6 right-6 z-20 w-80 bg-slate-900/95 backdrop-blur border border-amber-400/40 p-5 rounded-2xl shadow-2xl hidden pointer-events-auto">
        <div class="flex justify-between items-center mb-2">
          <div class="flex items-center gap-1.5 text-amber-400 text-xs font-bold uppercase tracking-wider">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
            <span>Specification</span>
          </div>
          <button onclick="closeTagPopout()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <h3 id="tag-title" class="font-bold text-sm text-white">Title</h3>
        <p id="tag-detail" class="text-xs text-slate-300 mt-1.5 leading-relaxed">Description</p>
      </div>

      <!-- Tag Placement Indicator -->
      <div id="studio-tag-toolbar" class="absolute top-6 left-6 z-20 flex items-center gap-2">
        <button id="btn-add-tag" onclick="toggleAddTag()" class="px-3 py-1.5 rounded-xl text-xs font-semibold border backdrop-blur transition flex items-center gap-1.5 shadow-xl bg-slate-900/80 border-slate-700 text-slate-200 hover:bg-slate-800">
          <i data-lucide="plus" class="w-3.5 h-3.5 text-amber-400"></i>
          <span id="tag-btn-text">Tag Feature on Photo</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // IndexedDB Setup for Unlimited High-Res Storage
    const DB_NAME = "PropertyStudioDB";
    const STORE_NAME = "project_store";

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbSave(key, val) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(val, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbGet(key) {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const req = tx.objectStore(STORE_NAME).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    // State Store
    let state = {
      title: "Luxury Property Listing",
      price: "$2,450,000",
      meta: "4 Beds • 3.5 Baths • 3,100 Sq Ft",
      blueprintUrl: null,
      activeRoomId: null,
      rooms: []
    };

    let isStudioMode = true;
    let isAddingPin = false;
    let isAddingTag = false;

    async function init() {
      const saved = await dbGet("current_project");
      if (saved) state = saved;

      document.getElementById('prop-title').value = state.title;
      document.getElementById('prop-price').value = state.price;
      document.getElementById('prop-meta').value = state.meta;

      if (state.blueprintUrl) {
        const canvas = document.getElementById('floorplan-canvas');
        canvas.style.backgroundImage = `url(${state.blueprintUrl})`;
        document.getElementById('vector-schematic').style.display = 'none';
      }

      if (state.rooms.length > 0 && !state.activeRoomId) {
        state.activeRoomId = state.rooms[0].id;
      }

      render();
      lucide.createIcons();
    }

    async function persist() {
      await dbSave("current_project", state);
    }

    function saveMeta() {
      state.title = document.getElementById('prop-title').value;
      state.price = document.getElementById('prop-price').value;
      state.meta = document.getElementById('prop-meta').value;
      persist();
    }

    function saveCurrentRoomMeta() {
      const room = state.rooms.find(r => r.id === state.activeRoomId);
      if (!room) return;
      room.name = document.getElementById('inp-room-name').value;
      room.dimensions = document.getElementById('inp-room-dims').value;
      room.ceiling = document.getElementById('inp-room-ceiling').value;
      room.description = document.getElementById('inp-room-desc').value;
      persist();
      renderPins();
      renderRoomTray();
    }

    async function clearAllData() {
      if (!confirm("Are you sure you want to clear this project and remove all uploaded photos?")) return;
      state = {
        title: "New Property Listing",
        price: "Price Upon Request",
        meta: "Beds • Baths • Sq Ft",
        blueprintUrl: null,
        activeRoomId: null,
        rooms: []
      };
      await persist();
      location.reload();
    }

    function render() {
      const activeRoom = state.rooms.find(r => r.id === state.activeRoomId);
      document.getElementById('room-count').innerText = state.rooms.length;

      const mainPhoto = document.getElementById('main-photo');
      const placeholder = document.getElementById('no-photo-placeholder');
      const infoCard = document.getElementById('room-info-card');

      if (activeRoom && activeRoom.imageUrl) {
        mainPhoto.src = activeRoom.imageUrl;
        mainPhoto.classList.remove('hidden');
        placeholder.classList.add('hidden');
        infoCard.classList.remove('hidden');

        document.getElementById('inp-room-name').value = activeRoom.name;
        document.getElementById('inp-room-dims').value = activeRoom.dimensions;
        document.getElementById('inp-room-ceiling').value = activeRoom.ceiling;
        document.getElementById('inp-room-desc').value = activeRoom.description;
      } else {
        mainPhoto.classList.add('hidden');
        placeholder.classList.remove('hidden');
        infoCard.classList.add('hidden');
      }

      renderPins();
      renderTags(activeRoom);
      renderRoomTray();

      const tuningBar = document.getElementById('pin-tuning-bar');
      if (isStudioMode && activeRoom && activeRoom.pin) {
        tuningBar.classList.remove('hidden');
        document.getElementById('angle-slider').value = activeRoom.pin.angle;
        document.getElementById('angle-display').innerText = activeRoom.pin.angle;
      } else {
        tuningBar.classList.add('hidden');
      }

      const studioPlanActions = document.getElementById('studio-plan-actions');
      const uploadPhotosBtn = document.getElementById('upload-photos-btn');
      const studioTagToolbar = document.getElementById('studio-tag-toolbar');
      const studioRoomDelete = document.getElementById('studio-room-delete');

      if (isStudioMode) {
        studioPlanActions.classList.remove('hidden');
        uploadPhotosBtn.classList.remove('hidden');
        studioTagToolbar.classList.remove('hidden');
        studioRoomDelete.classList.remove('hidden');
        document.getElementById('mode-text').innerText = 'Client Preview';
        document.getElementById('btn-mode').className = "px-3.5 py-1.5 rounded-xl text-xs font-semibold border transition flex items-center gap-2 bg-blue-600 border-blue-400 text-white shadow-lg shadow-blue-600/20";
      } else {
        studioPlanActions.classList.add('hidden');
        uploadPhotosBtn.classList.add('hidden');
        studioTagToolbar.classList.add('hidden');
        studioRoomDelete.classList.add('hidden');
        document.getElementById('mode-text').innerText = 'Studio Mode';
        document.getElementById('btn-mode').className = "px-3.5 py-1.5 rounded-xl text-xs font-semibold border transition flex items-center gap-2 bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700";
      }

      lucide.createIcons();
    }

    function renderPins() {
      const container = document.getElementById('pins-container');
      container.innerHTML = '';

      state.rooms.forEach(r => {
        if (!r.pin) return;
        const isSelected = r.id === state.activeRoomId;
        const pinEl = document.createElement('div');
        pinEl.className = 'absolute -translate-x-1/2 -translate-y-1/2 cursor-pointer pointer-events-auto group';
        pinEl.style.left = `${r.pin.x}%`;
        pinEl.style.top = `${r.pin.y}%`;

        pinEl.onclick = (e) => {
          e.stopPropagation();
          selectRoom(r.id);
        };

        pinEl.innerHTML = `
          ${isSelected ? `
            <div style="transform: rotate(${r.pin.angle - 90}deg)" class="absolute w-36 h-36 -top-16 -left-16 pointer-events-none transition-transform duration-150 origin-center">
              <div class="w-full h-full bg-gradient-to-t from-blue-500/40 via-blue-400/15 to-transparent vision-cone"></div>
            </div>` : ''}
          <div class="relative flex items-center justify-center w-8 h-8 rounded-full border-2 transition-all duration-300 ${isSelected ? 'bg-blue-600 border-white shadow-[0_0_16px_#3b82f6] scale-110' : 'bg-slate-900 border-slate-600 hover:border-blue-400 hover:scale-105'}">
            <i data-lucide="camera" class="w-3.5 h-3.5 ${isSelected ? 'text-white' : 'text-slate-300'}"></i>
          </div>
          <span class="absolute top-9 left-1/2 -translate-x-1/2 text-[10px] font-semibold px-2 py-0.5 rounded whitespace-nowrap shadow-xl border pointer-events-none transition ${isSelected ? 'bg-blue-600 border-blue-400 text-white' : 'bg-slate-950/90 border-slate-800 text-slate-300 group-hover:border-slate-700'}">
            ${r.name}
          </span>`;
        container.appendChild(pinEl);
      });
    }

    function renderTags(room) {
      const container = document.getElementById('tags-layer');
      container.innerHTML = '';
      if (!room || !room.tags) return;

      room.tags.forEach(t => {
        const tagEl = document.createElement('div');
        tagEl.className = 'absolute -translate-x-1/2 -translate-y-1/2 z-20 group cursor-pointer pointer-events-auto';
        tagEl.style.left = `${t.x}%`;
        tagEl.style.top = `${t.y}%`;
        tagEl.onclick = (e) => { e.stopPropagation(); showTagPopout(t); };
        tagEl.innerHTML = `
          <div class="relative flex items-center justify-center">
            <div class="w-6 h-6 rounded-full bg-slate-900/80 border border-white/80 backdrop-blur shadow-2xl flex items-center justify-center group-hover:scale-125 transition-transform">
              <i data-lucide="sparkles" class="w-3 h-3 text-amber-300"></i>
            </div>
            <div class="absolute -inset-1 rounded-full border border-amber-300/60 animate-ping pointer-events-none"></div>
          </div>
          <span class="absolute top-7 left-1/2 -translate-x-1/2 text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-950/90 text-white border border-slate-700 whitespace-nowrap shadow-xl opacity-0 group-hover:opacity-100 transition-opacity">
            ${t.title}
          </span>`;
        container.appendChild(tagEl);
      });
    }

    function renderRoomTray() {
      const tray = document.getElementById('room-tray');
      tray.innerHTML = '';
      state.rooms.forEach(r => {
        const isSelected = r.id === state.activeRoomId;
        const btn = document.createElement('button');
        btn.className = `flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition border shrink-0 ${isSelected ? 'bg-blue-600 border-blue-400 text-white shadow-lg shadow-blue-500/20' : 'bg-slate-900/80 border-slate-800 text-slate-300 hover:bg-slate-800'}`;
        btn.onclick = () => selectRoom(r.id);
        btn.innerHTML = `<div class="w-5 h-5 rounded-md bg-cover bg-center border border-white/20" style="background-image: url('${r.imageUrl}')"></div><span>${r.name}</span>`;
        tray.appendChild(btn);
      });
    }

    function selectRoom(roomId) {
      state.activeRoomId = roomId;
      closeTagPopout();
      persist();
      render();
    }

    function toggleMode() {
      isStudioMode = !isStudioMode;
      isAddingPin = false;
      isAddingTag = false;
      render();
    }

    function toggleAddPin() {
      if (!state.activeRoomId) {
        alert("Upload or select a room first!");
        return;
      }
      isAddingPin = !isAddingPin;
      const btn = document.getElementById('btn-drop-pin');
      const text = document.getElementById('pin-btn-text');
      const canvas = document.getElementById('floorplan-canvas');

      if (isAddingPin) {
        btn.className = "text-[11px] font-semibold px-2.5 py-1 rounded-lg border transition flex items-center gap-1 bg-amber-500 border-amber-400 text-slate-950 font-bold animate-pulse";
        text.innerText = "Click Floor...";
        canvas.classList.add('cursor-crosshair', 'ring-2', 'ring-amber-500/50');
      } else {
        btn.className = "text-[11px] font-semibold px-2.5 py-1 rounded-lg border transition flex items-center gap-1 bg-blue-600/20 border-blue-500/40 text-blue-400 hover:bg-blue-600/30";
        text.innerText = "Place Pin";
        canvas.classList.remove('cursor-crosshair', 'ring-2', 'ring-amber-500/50');
      }
    }

    function handlePlanClick(e) {
      if (!isAddingPin) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
      const y = Math.round(((e.clientY - rect.top) / rect.height) * 100);

      const activeRoom = state.rooms.find(r => r.id === state.activeRoomId);
      if (activeRoom) {
        activeRoom.pin = { x, y, angle: 0 };
        persist();
      }
      toggleAddPin();
      render();
    }

    function updatePinAngle(val) {
      const activeRoom = state.rooms.find(r => r.id === state.activeRoomId);
      if (activeRoom && activeRoom.pin) {
        activeRoom.pin.angle = parseInt(val);
        document.getElementById('angle-display').innerText = val;
        persist();
        renderPins();
      }
    }

    function deleteCurrentPin() {
      const activeRoom = state.rooms.find(r => r.id === state.activeRoomId);
      if (activeRoom) {
        activeRoom.pin = null;
        persist();
        render();
      }
    }

    function deleteCurrentRoom() {
      if (!confirm("Delete this room photo from your project?")) return;
      state.rooms = state.rooms.filter(r => r.id !== state.activeRoomId);
      state.activeRoomId = state.rooms[0]?.id || null;
      persist();
      render();
    }

    function toggleAddTag() {
      if (!state.activeRoomId) return;
      isAddingTag = !isAddingTag;
      const btn = document.getElementById('btn-add-tag');
      const text = document.getElementById('tag-btn-text');

      if (isAddingTag) {
        btn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold border backdrop-blur transition flex items-center gap-1.5 shadow-xl bg-amber-500 border-amber-400 text-slate-950 font-bold animate-pulse";
        text.innerText = "Click on Photo...";
      } else {
        btn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold border backdrop-blur transition flex items-center gap-1.5 shadow-xl bg-slate-900/80 border-slate-700 text-slate-200 hover:bg-slate-800";
        text.innerText = "Tag Feature on Photo";
      }
    }

    function handlePhotoClick(e) {
      if (!isAddingTag) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
      const y = Math.round(((e.clientY - rect.top) / rect.height) * 100);

      const title = prompt("Feature Title (e.g., Quartz Island, Sub-Zero Fridge):", "Architectural Finish");
      if (!title) { toggleAddTag(); return; }
      const detail = prompt("Specification / Details:", "Premium material with bespoke fixtures.");

      const activeRoom = state.rooms.find(r => r.id === state.activeRoomId);
      if (activeRoom) {
        activeRoom.tags = activeRoom.tags || [];
        activeRoom.tags.push({ id: 'tag_' + Date.now(), x, y, title, detail: detail || '' });
        persist();
      }
      toggleAddTag();
      render();
    }

    function showTagPopout(tag) {
      document.getElementById('tag-title').innerText = tag.title;
      document.getElementById('tag-detail').innerText = tag.detail;
      document.getElementById('tag-popout').classList.remove('hidden');
    }

    function closeTagPopout() { document.getElementById('tag-popout').classList.add('hidden'); }

    // Automatic In-Browser Compression (Keeps images crisp while enabling fast upload)
    function compressImage(file, maxDimension = 1920, quality = 0.8) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > height && width > maxDimension) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            } else if (height > maxDimension) {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function uploadPhotos(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      const uploadBtn = document.getElementById('upload-photos-btn');
      uploadBtn.innerHTML = `<i data-lucide="loader" class="w-3 h-3 animate-spin"></i> Uploading...`;
      lucide.createIcons();

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const compressedBase64 = await compressImage(file);
        const newRoom = {
          id: 'room_' + Date.now() + '_' + i,
          name: file.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' '),
          dimensions: "20' × 15'",
          ceiling: "10' 6\"",
          imageUrl: compressedBase64,
          description: "Custom property space.",
          pin: null,
          tags: []
        };
        state.rooms.push(newRoom);
        if (!state.activeRoomId) state.activeRoomId = newRoom.id;
      }

      await persist();
      render();

      uploadBtn.innerHTML = `<i data-lucide="plus" class="w-3 h-3"></i> Upload Photos<input id="photo-input" type="file" multiple accept="image/*" onchange="uploadPhotos(event)" class="hidden">`;
      lucide.createIcons();
    }

    async function uploadBlueprint(e) {
      const file = e.target.files[0];
      if (!file) return;
      const compressed = await compressImage(file, 1600, 0.85);
      state.blueprintUrl = compressed;
      const canvas = document.getElementById('floorplan-canvas');
      canvas.style.backgroundImage = `url(${state.blueprintUrl})`;
      document.getElementById('vector-schematic').style.display = 'none';
      await persist();
    }

    init();
  </script>
</body>
</html>
